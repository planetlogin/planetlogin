name: Portal image

on:
  push:
    branches: [main]
    paths: ['flavors/svelte/**', 'packages/core/**', '.github/workflows/portal-image.yml']
    tags: ['portal-v*']
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/planetlogin/portal
          # `{{is_default_branch}}` is docker/metadata-action's own template:
          # double braces, no dollar. Written as `${{ }}` it is a GitHub Actions
          # expression instead, and Actions has no such context — the workflow
          # failed to start at all (0s, five runs out of five, nothing published).
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=match,pattern=portal-v(.*),group=1
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: flavors/svelte/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
