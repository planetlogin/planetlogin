name: Release Core

on:
  push:
    tags: ['core-v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w @planetlogin/core
      - run: npm test -w @planetlogin/core
      - run: npm run build -w @planetlogin/core
      - run: npm publish -w @planetlogin/core --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
